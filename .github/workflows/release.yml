name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching Cargo.toml
        required: true
        default: v0.1.0
        type: string
      publish:
        description: Publish to crates.io and GitHub
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify version and tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          package = tomllib.loads(Path("Cargo.toml").read_text())["package"]
          version = package["version"]
          if package["name"] != "ferese-shape" or os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("Release tag must match the ferese-shape package version")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY
      - run: cargo fmt --check
      - run: cargo test --release
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo publish --dry-run --locked
      - uses: actions/upload-artifact@v4
        with:
          name: ferese-shape-${{ steps.version.outputs.version }}
          path: target/package/ferese-shape-${{ steps.version.outputs.version }}.crate
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: ferese-shape-${{ needs.package.outputs.version }}
          path: release-artifacts
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            "release-artifacts/ferese-shape-${RELEASE_VERSION}.crate" \
            --verify-tag --title "ferese-shape ${RELEASE_VERSION}" \
            --notes-file CHANGELOG.md
